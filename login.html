<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW REQUIEM - Acceso</title>
    <!-- Usamos los mismos estilos base de tu web -->
    <link rel="stylesheet" href="assets/css/estilos.css">

    <!-- Cargamos el script de autenticación de forma modular -->
        <!-- Forzamos al navegador a descargar la nueva versión sin caché -->
    <script type="module" src="assets/js/auth.js?v=1.1"></script>

</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; box-sizing: border-box;">

    <div class="box-normas" style="width: 100%; max-width: 400px; padding: 2.5rem; border-color: rgba(147, 51, 234, 0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="color: #a855f7; font-size: 2rem; letter-spacing: 0.05em; margin: 0 0 0.5rem 0;">SHADOW REQUIEM</h1>
            <p style="color: #9ca3af; font-size: 0.95rem; margin: 0;">Ingresa tus credenciales de Hermandad</p>
        </div>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div>
                <label style="display: block; color: #d8b4fe; font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: 500;">Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="tu-usuario@gmail.com" style="width: 100%; padding: 0.75rem; background-color: #030712; border: 1px solid #374151; color: white; border-radius: 0.375rem; box-sizing: border-box; font-size: 1rem;">
            </div>

            <div>
                <label style="display: block; color: #d8b4fe; font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: 500;">Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; background-color: #030712; border: 1px solid #374151; color: white; border-radius: 0.375rem; box-sizing: border-box; font-size: 1rem;">
            </div>

            <button type="submit" class="btn-discord" style="width: 100%; padding: 0.85rem; border: none; cursor: pointer; font-size: 1rem; margin-top: 0.5rem;">
                Iniciar Sesión
            </button>
        </form>
    </div>

</body>
</html>
